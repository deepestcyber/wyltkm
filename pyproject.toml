[project]
name = "wyltkm"
version = "0.4.0"
description = "Would you like to know more? QR codes with text, icons and designs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "cairosvg>=2.7",
    "defusedxml>=0.7",
    "qrcode>=8.0",
    "ziafont>=0.10",
]

[project.optional-dependencies]
web = [
    "flask>=3.0",
    "python-slugify>=8.0",
]

[project.scripts]
wyltkm = "wyltkm.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pillow>=10",
    "zxing-cpp>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wyltkm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:path is deprecated:DeprecationWarning:ziafont"]
