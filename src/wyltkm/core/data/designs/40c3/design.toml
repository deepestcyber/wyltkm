name = "40c3"
title = "40c3"
description = "40th Chaos Communication Congress: Model Citizens. Tricolore of A, B and one colour; Jersey 10"
default_scheme = "green"

# Shared by all schemes: B (near black) background, A (pale green) details.
[colours]
background = "#031202"
modules = "#75B54B"
finder_centre = "#DFEED5"
icon = "#DFEED5"
bottom = "#DFEED5"

[qr]
module_shape = "square"
finder_ring_shape = "square"
finder_centre_shape = "square"

[top]
fonts = ["jersey-10-latin-400-normal.ttf"]

[bottom]
type = "text"
fonts = ["jersey-10-latin-400-normal.ttf"]
lines = ["WOULD YOU LIKE", "TO KNOW [MORE]?"]

[side]
fonts = ["Hack-Regular.ttf"]

[defaults]
icon = "40c3:logos/40c3-logo-a"

[licence]
name = "CC0-1.0"
url = "https://events.ccc.de/congress/2026/infos/styleguide/"
holder = "Chaos Computer Club"

[schemes.green]
title = "Green (main)"
modules = "#75B54B"
finder_ring = "#75B54B"
